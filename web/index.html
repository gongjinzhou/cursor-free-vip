<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursor VIP Tools</title>
    <link href="tailwind.min.css" rel="stylesheet">
    <script src="vue.min.js"></script>
    <style>
        [v-cloak] {
            display: none;
        }
        .btn {
            @apply px-4 py-2 rounded-lg transition-all duration-200 ease-in-out shadow-md;
        }
        .btn-primary {
            @apply bg-blue-500 text-white hover:bg-blue-600 hover:shadow-lg transform hover:-translate-y-0.5;
        }
        .btn-danger {
            @apply bg-red-500 text-white hover:bg-red-600 hover:shadow-lg transform hover:-translate-y-0.5;
        }
        .btn-success {
            @apply bg-green-500 text-white hover:bg-green-600 hover:shadow-lg transform hover:-translate-y-0.5;
        }
        .output-container {
            @apply mt-6 p-3 shadow-xl;
            background-color: #1a1a1a;
            color: #e0e0e0;
            max-height: calc(100vh - 300px);
            min-height: calc(100vh - 300px);
            overflow-x: hidden;
            overflow-y: auto;
            font-family: 'JetBrains Mono', 'Consolas', monospace;
            font-size: 12px;
            line-height: 1.2;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.3) rgba(26, 26, 26, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
        }
        .output-container::-webkit-scrollbar {
            width: 6px;
        }
        .output-container::-webkit-scrollbar-track {
            background: rgba(26, 26, 26, 0.8);
            border-radius: 6px;
        }
        .output-container::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            transition: background-color 0.3s ease;
        }
        .output-container::-webkit-scrollbar-thumb:hover {
            background-color: rgba(255, 255, 255, 0.4);
        }
        .translation-key {
            display: grid;
            grid-template-columns: minmax(200px, auto) 1fr;
            gap: 12px;
            padding: 2px 6px;
            margin: 1px 0;
            border-radius: 4px;
            transition: all 0.2s ease;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            align-items: start;
        }
        .translation-key:hover {
            background-color: rgba(255, 255, 255, 0.05);
            transform: translateX(2px);
        }
        .translated-text {
            color: #B9F6CA;
            word-break: break-all;
            letter-spacing: 0.1px;
            line-height: 1.2;
            text-align: left;
            padding-left: 0;
        }
        .language-select {
            @apply px-3 py-2 border rounded-lg bg-white shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none;
        }
        .fade-enter-active, .fade-leave-active {
            transition: opacity 0.3s;
        }
        .fade-enter, .fade-leave-to {
            opacity: 0;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div id="app" v-cloak class="container mx-auto px-4 py-4">
        <div class="bg-white rounded-xl shadow-xl p-8">
            <div class="flex justify-between items-center mb-8">
                <div>
                    <h1 class="text-3xl font-bold text-gray-800 mb-2">
                        <span class="text-blue-500">Cursor</span> VIP Tools
                    </h1>
                    <p class="text-gray-600">管理您的Cursor VIP工具和设置</p>
                </div>
                <select v-model="selectedLanguage" 
                        @change="changeLanguage" 
                        class="language-select">
                    <option v-for="(name, code) in languages" 
                            :key="code" 
                            :value="code">
                        {{ name }}
                    </option>
                </select>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <button @click="resetMachine" 
                        class="btn btn-primary flex items-center justify-center group">
                    <span class="mr-2 transform group-hover:rotate-180 transition-transform duration-500">🔄</span> 
                    重置机器
                </button>
                <button @click="register" 
                        class="btn btn-success flex items-center justify-center">
                    <span class="mr-2">✅</span> 注册
                </button>
                <button @click="quitCursor" 
                        class="btn btn-danger flex items-center justify-center">
                    <span class="mr-2">❌</span> 退出Cursor
                </button>
            </div>

            <transition name="fade">
                <div class="output-container" ref="outputContainer">
                    <div v-for="(line, index) in outputLines" 
                         :key="index" 
                         class="translation-key"
                         v-if="line.text.trim()">
                        <span class="translated-text">
                            {{ filterText(line.text) }}
                        </span>
                    </div>
                </div>
            </transition>
        </div>
    </div>

    <script>
        // 等待 pywebview 加载完成
        function initVue() {
            new Vue({
                el: '#app',
                data: {
                    languages: {},
                    selectedLanguage: 'zh_cn',
                    translations: {},
                    outputLines: [],
                    lastOutput: '',
                    processedLines: new Set(), // 用于跟踪已处理的行
                },
                methods: {
                    filterText(text) {
                        // 移除ℹ️表情符号
                        text = text.replace(/ℹ️/g, '');
                        // 移除ANSI控制字符和其他特殊字符
                        text = text.replace(/\[\d+m/g, '');  // 移除类似[32m的控制字符
                        text = text.replace(/\u001b\[\d+m/g, '');  // 移除ESC控制序列
                        text = text.replace(/^\s*[-=\[\]]+/, '');  // 移除开头的特殊字符
                        text = text.replace(/[-=\[\]]+\s*$/, '');  // 移除结尾的特殊字符
                        // 移除开头和结尾的特定字符
                        text = text.replace(//, '');  // 移除开头的特定字符
                        text = text.replace(/+$/, '');  // 移除结尾的特定字符
                        text = text.replace(/Press Enter to Exit/, 'The task has been completed');
                        text = text.replace(/按回車鍵退出/, '任務已完成');
                        text = text.replace(/按回车键退出/, '任务已完成');
                        return text.trim();
                    },
                    async initLanguages() {
                        try {
                            this.languages = await pywebview.api.get_available_languages();
                            await this.updateTranslations();
                            this.startOutputPolling();
                        } catch (error) {
                            console.error('Error initializing languages:', error);
                        }
                    },
                    async changeLanguage(event) {
                        await pywebview.api.set_language(this.selectedLanguage);
                        await this.updateTranslations();
                        this.lastOutput = '';
                        await this.updateOutput();
                    },
                    async updateTranslations() {
                        try {
                            this.translations = await pywebview.api.get_translations();
                        } catch (error) {
                            console.error('Error updating translations:', error);
                        }
                    },
                    getTranslation(key) {
                        if (!key) return null;
                        try {
                            const keys = key.split('.');
                            let value = this.translations;
                            for (const k of keys) {
                                if (!value || typeof value !== 'object') return null;
                                value = value[k];
                            }
                            return value;
                        } catch (error) {
                            console.error('Error getting translation:', error);
                            return null;
                        }
                    },
                    shouldShowKeyText(key, text) {
                        if (!key || key.trim() === '') return false;
                        const isOnlySpecialChars = /^[^a-zA-Z\u4e00-\u9fa5]+$/.test(text);
                        if (isOnlySpecialChars) return false;
                        const excludedPrefixes = ['system.', 'debug.', 'log.'];
                        return !excludedPrefixes.some(prefix => key.startsWith(prefix));
                    },
                    async updateOutput() {
                        try {
                            const result = await pywebview.api.get_print_output();
                            console.log(result);
                            if (result && result.text) {
                                // 只获取新增的内容
                                const newText = result.text.replace(this.lastOutput, '').trim();
                                if (!newText) return;
                                
                                const newLines = newText.split('\n');
                                const keys = result.keys || [];
                                
                                // 将新行添加到现有输出中
                                const startIndex = this.lastOutput ? this.outputLines.length : 0;
                                newLines.forEach((text, index) => {
                                    if (text.trim()) {
                                        this.outputLines.push({
                                            text,
                                            key: keys[startIndex + index] || ''
                                        });
                                    }
                                });
                                
                                // 限制最大显示行数
                                if (this.outputLines.length > 1000) {
                                    this.outputLines = this.outputLines.slice(-1000);
                                }
                                
                                this.lastOutput = result.text;
                                this.$nextTick(() => {
                                    if (this.$refs.outputContainer) {
                                        this.$refs.outputContainer.scrollTop = this.$refs.outputContainer.scrollHeight;
                                    }
                                });
                            }
                        } catch (error) {
                            console.error('Error updating output:', error);
                        }
                    },
                    startOutputPolling() {
                        setInterval(this.updateOutput, 500);
                    },
                    async resetMachine() {
                        await pywebview.api.reset_machine();
                    },
                    async register() {
                        // await pywebview.api.quit_cursor();
                        await pywebview.api.register();
                    },
                    async quitCursor() {
                        await pywebview.api.quit_cursor();
                    }
                },
                mounted() {
                    this.initLanguages();
                }
            });
        }

        // 检查 pywebview 是否已加载
        if (window.pywebview) {
            initVue();
        } else {
            window.addEventListener('pywebviewready', initVue);
        }
    </script>
</body>
</html>
